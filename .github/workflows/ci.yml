name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Base PostgreSQL réelle pour les tests d'accès (API) et la pile E2E.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lenseignement
          POSTGRES_PASSWORD: change-me-dev-only
          POSTGRES_DB: lenseignement_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lenseignement"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lenseignement:change-me-dev-only@localhost:5432/lenseignement_test
      E2E_DATABASE_URL: postgresql://lenseignement:change-me-dev-only@localhost:5432/lenseignement_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Créer la base E2E
        run: psql "$TEST_DATABASE_URL" -c 'create database lenseignement_e2e'
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
